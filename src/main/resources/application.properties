spring.application.name=web-push-service-java
server.port=8080

# Directory for persistent JSON state (subscriptions, deliveries, VAPID key)
webpush.data-dir=data
# Maximum delivery attempts for a push message
webpush.max-retries=3
# Initial retry backoff in milliseconds; further attempts multiply by backoff-multiplier
webpush.retry-backoff-millis=500
webpush.backoff-multiplier=2.0
# Scheduler polling interval
webpush.dispatch-interval-millis=200
# Lifetime (seconds) of signed VAPID JWTs
webpush.vapid-ttl-seconds=43200
