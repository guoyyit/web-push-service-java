spring.application.name=web-push-service-java

push.data-dir=./push-data
push.vapid-audience=http://localhost:8080
push.vapid-subject=mailto:admin@localhost
push.vapid-expiry-seconds=43200
push.max-delivery-attempts=5
push.retry-base-delay-millis=200
push.retry-backoff-multiplier=2.0
push.max-retry-delay-millis=30000
push.scheduler-interval-millis=100
push.default-ttl-seconds=3600
push.max-ttl-seconds=86400
